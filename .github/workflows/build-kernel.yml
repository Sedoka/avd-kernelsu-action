name: Build AVD KernelSU

'on':
  workflow_dispatch:
    inputs:
      kernel_manifest_branch:
        description: 'AOSP Kernel Manifest Branch'
        required: true
        default: 'common-android16-6.12-2025-09'
        type: string
      ksu_flavor:
        description: 'KernelSU Variant (KernelSU-Next, KernelSU, SukiSU-Ultra, ReSukiSU)'
        required: true
        default: 'KernelSU-Next'
        type: choice
        options:
          - 'KernelSU-Next'
          - 'KernelSU'
          - 'SukiSU-Ultra'
          - 'ReSukiSU'
      ksu_version:
        description: 'KernelSU branch / tag / commit SHA (KernelSU-Next: dev; Others: main)'
        required: true
        default: 'dev'
        type: string
      build_target:
        description: 'Kleaf Build Target'
        required: true
        default: '//common-modules/virtual-device:virtual_device_x86_64_dist'
        type: string
      lto_mode:
        description: 'Link Time Optimization (LTO)'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'thin'
          - 'default'
      use_fast_config:
        description: 'Enable Kleaf --config=fast'
        required: false
        default: true
        type: boolean
      extra_bazel_args:
        description: 'Additional Bazel Arguments'
        required: false
        default: '--jobs=4'
        type: string
      enable_susfs:
        description: 'Integrate SuSFS (Kernel-level root hiding)'
        required: false
        default: false
        type: boolean
      susfs_branch:
        description: 'SuSFS git branch (empty = auto-detect based on kernel branch, e.g. gki-android16-6.12)'
        required: false
        default: ''
        type: string
      susfs_commit:
        description: 'SuSFS commit to pin (empty = branch tip). SukiSU-Ultra builtin (b20dee7) needs edec89b or older for 6.12: later SuSFS calls hooks builtin lacks'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build AVD Kernel
    runs-on: ubuntu-24.04
    env:
      KERNEL_MANIFEST_BRANCH: ${{ inputs.kernel_manifest_branch || 'common-android16-6.12-2025-09' }}
      KSU_FLAVOR: ${{ inputs.ksu_flavor || 'KernelSU-Next' }}
      KSU_VERSION: ${{ inputs.ksu_version || 'dev' }}
      BUILD_TARGET: ${{ inputs.build_target || '//common-modules/virtual-device:virtual_device_x86_64_dist' }}
      LTO_MODE: ${{ inputs.lto_mode || 'none' }}
      USE_FAST_CONFIG: ${{ inputs.use_fast_config != false }}
      EXTRA_BAZEL_ARGS: ${{ inputs.extra_bazel_args || '--jobs=4' }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs == true }}
      SUSFS_BRANCH: ${{ inputs.susfs_branch || '' }}
      SUSFS_COMMIT: ${{ inputs.susfs_commit || '' }}

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          overprovision-lvm: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Environment Resources
        run: |
          echo "=== Disk Space ==="
          df -h
          echo "=== Memory & Swap ==="
          free -h
          echo "=== CPU Info ==="
          nproc
          lscpu | grep "Model name\|CPU(s):" || true

      - name: Install Dependencies & Setup Repo Tool
        run: |
          sudo apt-get install -y --no-install-recommends bison flex libssl-dev libelf-dev bc 2>/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends bison flex libssl-dev libelf-dev bc
          }
          mkdir -p ~/.bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync Kernel Source via Repo
        run: |
          mkdir -p android-kernel
          cd android-kernel
          BRANCH="${{ env.KERNEL_MANIFEST_BRANCH }}"
          echo "Initializing repo for branch: $BRANCH"
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "$BRANCH"
          # Older dated manifests pin kernel/common to a branch (e.g.
          # android12-5.10-2021-12) that AOSP later moved under deprecated/, so the
          # manifest's branch-ref sync fails ("couldn't find remote ref"). If that is
          # the case, remap kernel/common to the deprecated/ ref via a local manifest.
          # (No-op for recent branches that are still live, e.g. the android16 path.)
          KBRANCH="${BRANCH#common-}"
          CGIT="https://android.googlesource.com/kernel/common"
          # NB: `git ls-remote <pat>` tail-matches, so "$KBRANCH" alone also matches
          # refs/heads/deprecated/$KBRANCH. Match the FULL ref exactly instead.
          CREFS="$(git ls-remote --heads "$CGIT")"
          if ! printf '%s\n' "$CREFS" | grep -qE "[[:space:]]refs/heads/${KBRANCH}$"; then
            if printf '%s\n' "$CREFS" | grep -qE "[[:space:]]refs/heads/deprecated/${KBRANCH}$"; then
              echo "kernel/common branch '$KBRANCH' moved under deprecated/; remapping."
              mkdir -p .repo/local_manifests
              printf '%s\n' \
                '<?xml version="1.0" encoding="UTF-8"?>' \
                '<manifest>' \
                '  <remove-project name="kernel/common" />' \
                "  <project path=\"common\" name=\"kernel/common\" revision=\"refs/heads/deprecated/$KBRANCH\" dest-branch=\"deprecated/$KBRANCH\" />" \
                '</manifest>' > .repo/local_manifests/deprecated-common.xml
              cat .repo/local_manifests/deprecated-common.xml
            fi
          fi
          echo "Syncing repository..."
          repo sync -c -j12 --no-tags --no-clone-bundle

      - name: Integrate KernelSU & Configure Kernel
        working-directory: android-kernel
        run: |
          set -eo pipefail
          echo "=== Integrating KernelSU Variant ==="
          case "$(echo "${{ env.KSU_FLAVOR }}" | tr '[:upper:]' '[:lower:]')" in
            "kernelsu-next")
              REPO_SLUG="KernelSU-Next/KernelSU-Next"
              DEFAULT_REF="dev"
              ;;
            "kernelsu")
              REPO_SLUG="tiann/KernelSU"
              DEFAULT_REF="main"
              ;;
            "sukisu"|"sukisu-ultra")
              REPO_SLUG="SukiSU-Ultra/SukiSU-Ultra"
              DEFAULT_REF="main"
              ;;
            "resukisu")
              REPO_SLUG="ReSukiSU/ReSukiSU"
              DEFAULT_REF="main"
              ;;
            *)
              REPO_SLUG="${{ env.KSU_FLAVOR }}"
              DEFAULT_REF="main"
              ;;
          esac
          REPO_URL="https://github.com/$REPO_SLUG"

          KSU_TARGET_VER="${{ env.KSU_VERSION }}"
          # If user left 'dev' while selecting a flavor whose default branch is 'main', adapt to default
          if [ "$DEFAULT_REF" != "dev" ] && [ "$KSU_TARGET_VER" = "dev" ]; then
            KSU_TARGET_VER="$DEFAULT_REF"
          fi
          [ -n "$KSU_TARGET_VER" ] || KSU_TARGET_VER="$DEFAULT_REF"
          # SukiSU-Ultra ships SuSFS natively on its 'builtin' branch (inline hooks, no
          # 10_enable_susfs_for_ksu patch, no x86 syscall dispatcher); 'main' cannot take SuSFS.
          if [ "$REPO_SLUG" = "SukiSU-Ultra/SukiSU-Ultra" ] && [ "${{ env.ENABLE_SUSFS }}" = "true" ] && [ "$KSU_TARGET_VER" = "main" ]; then
            KSU_TARGET_VER="builtin"
            echo "SuSFS enabled with SukiSU-Ultra: using the native 'builtin' branch"
          fi
          # KernelSU-Next has no native SuSFS on its own 'dev'; pershoot's fork carries SuSFS
          # integrated (KSU-side hooks + x86 syscall dispatcher), and its driver version matches
          # the stock KernelSU-Next manager, unlike SukiSU-Ultra which the x86 KSU-Next manager
          # only half-recognizes. Route KernelSU-Next + SuSFS to pershoot/KernelSU-Next dev-susfs.
          if [ "$REPO_SLUG" = "KernelSU-Next/KernelSU-Next" ] && [ "${{ env.ENABLE_SUSFS }}" = "true" ]; then
            REPO_SLUG="pershoot/KernelSU-Next"
            REPO_URL="https://github.com/$REPO_SLUG"
            KSU_TARGET_VER="dev-susfs"
            echo "SuSFS enabled with KernelSU-Next: using pershoot/KernelSU-Next dev-susfs (native SuSFS)"
          fi
          # Fail loudly on a nonexistent ref instead of silently falling back to the
          # default branch (which would build an unexpected KernelSU commit).
          # Pure 40-char hex values are treated as commit SHAs and skipped here.
          case "$KSU_TARGET_VER" in
            (*[!0-9a-f]*)
              if ! git ls-remote --exit-code "$REPO_URL" "$KSU_TARGET_VER" >/dev/null 2>&1; then
                echo "::error::'$KSU_TARGET_VER' is not a branch or tag in $REPO_URL. Use a real ref (e.g. '$DEFAULT_REF') or a 40-char commit SHA."
                exit 1
              fi
              ;;
            (*) echo "Interpreting '$KSU_TARGET_VER' as a commit SHA (skipping ref lookup)" ;;
          esac

          SETUP_URL="https://raw.githubusercontent.com/$REPO_SLUG/$KSU_TARGET_VER/kernel/setup.sh"

          echo "Flavor: ${{ env.KSU_FLAVOR }}"
          echo "Repo: $REPO_URL"
          echo "Ref: $KSU_TARGET_VER"
          echo "Setup URL: $SETUP_URL"

          # Execute setup.sh inside common/ (-f so a 404 is an error, not an HTML pipe into bash)
          cd common
          curl -LSsf "$SETUP_URL" | bash -s "$KSU_TARGET_VER"

          # Inject CONFIG_KSU into defconfigs
          echo "=== Injecting CONFIG_KSU and x86_64 dispatcher patch into defconfigs ==="
          if [ -f "arch/x86/configs/gki_defconfig" ]; then
            grep -q "CONFIG_KSU" arch/x86/configs/gki_defconfig || echo "CONFIG_KSU=y" >> arch/x86/configs/gki_defconfig
            grep -q "CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER" arch/x86/configs/gki_defconfig || echo "CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y" >> arch/x86/configs/gki_defconfig
            grep -q "CONFIG_OVERLAY_FS" arch/x86/configs/gki_defconfig || echo "CONFIG_OVERLAY_FS=y" >> arch/x86/configs/gki_defconfig
            grep -q "CONFIG_KPROBES" arch/x86/configs/gki_defconfig || echo "CONFIG_KPROBES=y" >> arch/x86/configs/gki_defconfig
            echo "Appended CONFIG_KSU & CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER to common/arch/x86/configs/gki_defconfig"
          fi

          # Ensure ccflags is set in KernelSU Kbuild & Makefile for x86_64 dynamic dispatcher
          if [ -f "drivers/kernelsu/Kbuild" ]; then
            grep -q -- "-DCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER" drivers/kernelsu/Kbuild || echo "ccflags-y += -DCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=1" >> drivers/kernelsu/Kbuild
          fi
          if [ -f "drivers/kernelsu/Makefile" ]; then
            grep -q -- "-DCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER" drivers/kernelsu/Makefile || echo "ccflags-y += -DCONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=1" >> drivers/kernelsu/Makefile
          fi

          # Safeguard: Neutralize fatal indirect syscall checks for x86 GKI
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#error "FATAL: Your kernel is missing the indirect syscall bypass patches!"/\/* bypassed indirect syscall check *\//g' {} + 2>/dev/null || true

          cd ..

          # Append to virtual-device config fragments if they exist
          find common-modules/virtual-device -name "*.fragment" 2>/dev/null | while read -r fragment; do
            echo "Patching fragment: $fragment"
            grep -q "CONFIG_KSU" "$fragment" || echo "CONFIG_KSU=y" >> "$fragment"
            grep -q "CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER" "$fragment" || echo "CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y" >> "$fragment"
          done

          # Integrate SuSFS if enabled
          if [ "${{ env.ENABLE_SUSFS }}" = "true" ]; then
            echo "=== Integrating SuSFS ==="
            SUSFS_REPO="https://gitlab.com/simonpunk/susfs4ksu.git"
            SUSFS_TARGET_BRANCH="${{ env.SUSFS_BRANCH }}"
            if [ -z "$SUSFS_TARGET_BRANCH" ]; then
              case "${{ env.KERNEL_MANIFEST_BRANCH }}" in
                *6.12*) SUSFS_TARGET_BRANCH="gki-android16-6.12" ;;
                *6.6*)  SUSFS_TARGET_BRANCH="gki-android15-6.6" ;;
                *6.1*)  SUSFS_TARGET_BRANCH="gki-android14-6.1" ;;
                *5.15*) SUSFS_TARGET_BRANCH="gki-android14-5.15" ;;
                *5.10*) SUSFS_TARGET_BRANCH="gki-android13-5.10" ;;
                *)      SUSFS_TARGET_BRANCH="gki-android16-6.12" ;;
              esac
            fi
            echo "SuSFS target branch: $SUSFS_TARGET_BRANCH"
            if [ -n "${{ env.SUSFS_COMMIT }}" ]; then
              git clone -b "$SUSFS_TARGET_BRANCH" "$SUSFS_REPO" susfs4ksu
              git -C susfs4ksu checkout --detach "${{ env.SUSFS_COMMIT }}"
            else
              git clone --depth=1 -b "$SUSFS_TARGET_BRANCH" "$SUSFS_REPO" susfs4ksu
            fi
            echo "SuSFS commit: $(git -C susfs4ksu log -1 --format='%h %cs %s')"

            # Copy kernel-level susfs files to common/
            cp -r susfs4ksu/kernel_patches/fs/* common/fs/
            cp -r susfs4ksu/kernel_patches/include/linux/* common/include/linux/

            # Apply kernel patch to common/
            PATCH_FILE=$(find susfs4ksu/kernel_patches -name "50_add_susfs_in_*.patch" | head -n 1)
            if [ -n "$PATCH_FILE" ] && [ -f "$PATCH_FILE" ]; then
              echo "Applying SuSFS kernel patch: $PATCH_FILE"
              # A rejected hunk here means a missing kernel hook: fail now, not at link/boot time.
              if ! (cd common && patch -p1 -N -t < "../$PATCH_FILE"); then
                echo "::error::SuSFS kernel patch has rejects:"
                find common -name "*.rej" -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
                exit 1
              fi
            fi

            # SukiSU-Ultra builtin still declares ksu_su_compat_enabled as a bool, while the
            # SuSFS kernel hooks use it as a static_key_true (static_branch_likely). The mismatch
            # links fine but jump_label_init would write key->entries over adjacent data.
            SUCOMPAT_C=common/drivers/kernelsu/feature/sucompat.c
            SUCOMPAT_H=common/drivers/kernelsu/feature/sucompat.h
            if grep -q "^bool ksu_su_compat_enabled" "$SUCOMPAT_C" 2>/dev/null && \
               grep -q "static_key_true ksu_su_compat_enabled" "$PATCH_FILE"; then
              echo "Converting ksu_su_compat_enabled to a static key"
              sed -i 's/^bool ksu_su_compat_enabled __read_mostly = true;/DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled);/' "$SUCOMPAT_C"
              sed -i 's/\*value = ksu_su_compat_enabled ? 1 : 0;/*value = static_key_enabled(\&ksu_su_compat_enabled) ? 1 : 0;/' "$SUCOMPAT_C"
              sed -i 's/^\(\s*\)ksu_su_compat_enabled = enable;/\1if (enable)\n\1    static_branch_enable(\&ksu_su_compat_enabled);\n\1else\n\1    static_branch_disable(\&ksu_su_compat_enabled);/' "$SUCOMPAT_C"
              sed -i 's/if (!ksu_su_compat_enabled)/if (!static_branch_likely(\&ksu_su_compat_enabled))/' "$SUCOMPAT_C"
              sed -i 's/^extern bool ksu_su_compat_enabled;/#include <linux\/jump_label.h>\nextern struct static_key_true ksu_su_compat_enabled;/' "$SUCOMPAT_H"
              if grep -qE "(^|[^_&(])ksu_su_compat_enabled *(=|\)|\?)" "$SUCOMPAT_C"; then
                echo "::error::ksu_su_compat_enabled still used as a bool in $SUCOMPAT_C"
                grep -n "ksu_su_compat_enabled" "$SUCOMPAT_C"
                exit 1
              fi
            fi

            # x86_64 uses GENERIC_ENTRY: TIF_SECCOMP does not exist there, the seccomp bit
            # lives in syscall_work (builtin only handles this when clearing, not testing).
            KSU_DIR=common/drivers/kernelsu
            # Per-file, structure-agnostic: works for SukiSU-Ultra (feature/sucompat.c) and
            # pershoot KernelSU-Next dev-susfs (policy/app_profile.c) alike. Inject an arch-aware
            # helper at the top of each affected .c and swap the raw TIF_SECCOMP test for it.
            SECCOMP_FILES=$(grep -rl "test_thread_flag(TIF_SECCOMP)" "$KSU_DIR" 2>/dev/null || true)
            if [ -n "$SECCOMP_FILES" ]; then
              echo "Wrapping TIF_SECCOMP tests for GENERIC_ENTRY (x86):"
              for f in $SECCOMP_FILES; do
                grep -q "ksu_seccomp_active" "$f" && continue
                # Swap the call FIRST, then prepend the definition, so the sed does not rewrite
                # the fallback macro body into a self-referential #define.
                sed -i 's/test_thread_flag(TIF_SECCOMP)/ksu_seccomp_active()/g' "$f"
                {
                  printf '%s\n' \
                    '#ifndef KSU_SECCOMP_ACTIVE_COMPAT' \
                    '#define KSU_SECCOMP_ACTIVE_COMPAT' \
                    '#include <linux/thread_info.h>' \
                    '#ifdef CONFIG_GENERIC_ENTRY' \
                    '#define ksu_seccomp_active() test_syscall_work(SECCOMP)' \
                    '#else' \
                    '#define ksu_seccomp_active() test_thread_flag(TIF_SECCOMP)' \
                    '#endif' \
                    '#endif'
                  cat "$f"
                } > "$f.ksutmp" && mv "$f.ksutmp" "$f"
                echo "  patched $f"
              done
              # A remaining hit is only a problem if it is a bare call, not our fallback
              # macro body (#define ksu_seccomp_active() test_thread_flag(TIF_SECCOMP)).
              if grep -rn "test_thread_flag(TIF_SECCOMP)" "$KSU_DIR" | grep -v "define ksu_seccomp_active"; then
                echo "::error::a bare test_thread_flag(TIF_SECCOMP) call remains after patch"; exit 1
              fi
            fi

            # x86: compat_uptr_t / compat_ptr() live in <linux/compat.h>. Some KernelSU-Next
            # files rely on it being pulled in transitively (true on arm64, not on x86), so
            # under CONFIG_COMPAT the x86 build fails with 'unknown type name compat_uptr_t'.
            COMPAT_FILES=$(grep -rlE "compat_uptr_t|compat_ptr\(|in_compat_syscall" "$KSU_DIR" 2>/dev/null || true)
            for f in $COMPAT_FILES; do
              grep -q "linux/compat.h" "$f" && continue
              sed -i '1i #include <linux/compat.h>' "$f"
              echo "Added <linux/compat.h> to $f"
            done

            # Linux >= 6.8: security_add_hooks() takes a struct lsm_id *, not a name. With SuSFS
            # inline hooks the list is empty, so skip the call ("ksu" stays out of the LSM list).
            if grep -q 'security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");' "$KSU_DIR/hook/lsm_hook.c" 2>/dev/null && \
               ! grep -q "struct lsm_id" "$KSU_DIR/hook/lsm_hook.c"; then
              echo "Adapting security_add_hooks() to struct lsm_id"
              perl -0pi -e 's/^(\s*)security_add_hooks\(ksu_hooks, ARRAY_SIZE\(ksu_hooks\), "ksu"\);\n#else/#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 8, 0)\n$1static const struct lsm_id ksu_lsmid = { .name = "ksu", .id = LSM_ID_UNDEF };\n$1if (ARRAY_SIZE(ksu_hooks))\n$1    security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsmid);\n#else\n$1security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), "ksu");\n#endif\n#else/m' "$KSU_DIR/hook/lsm_hook.c"
              grep -q "ksu_lsmid" "$KSU_DIR/hook/lsm_hook.c" || { echo "::error::could not adapt lsm_hook.c"; exit 1; }
            fi

            # Apply KernelSU-side patch if required (ReSukiSU already has native inline hooks)
            KSU_PATCH="$(pwd)/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            if [ -f "$KSU_PATCH" ]; then
              # Apply from the KernelSU(-Next) ROOT (patch paths are kernel/...), not kernel/ subdir.
              # Absolute patch path so the subshell cd doesn't break it.
              for kroot in common/KernelSU-Next common/KernelSU common/SukiSU-Ultra common/drivers/kernelsu; do
                [ -d "$kroot" ] || continue
                kroot_real=$(readlink -f "$kroot" 2>/dev/null || echo "$kroot")
                case "$kroot_real" in */kernel) kroot_real=$(dirname "$kroot_real");; esac
                if [ -f "$kroot_real/kernel/Kconfig" ] && ! grep -q "KSU_SUSFS" "$kroot_real/kernel/Kconfig"; then
                  echo "Applying SuSFS hook patch from root: $kroot_real"
                  (cd "$kroot_real" && patch -p1 -N -t < "$KSU_PATCH") || echo "SuSFS hook patch had rejects (continuing)"
                fi
                break
              done
            fi

            # Enable CONFIG_KSU_SUSFS in defconfigs and virtual-device fragments
            echo "=== Enabling CONFIG_KSU_SUSFS configs ==="
            for cfg in \
              "CONFIG_KSU_SUSFS=y" \
              "CONFIG_KSU_SUSFS_SUS_PATH=y" \
              "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" \
              "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" \
              "CONFIG_KSU_SUSFS_SUS_KSTAT=y" \
              "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" \
              "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" \
              "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
              "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
              "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
              "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" \
              "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" \
              "CONFIG_KSU_SUSFS_SUS_SU=y"; do
              if [ -f "common/arch/x86/configs/gki_defconfig" ]; then
                grep -q "$cfg" "common/arch/x86/configs/gki_defconfig" || echo "$cfg" >> "common/arch/x86/configs/gki_defconfig"
              fi
              find common-modules/virtual-device -name "*.fragment" 2>/dev/null | while read -r fragment; do
                grep -q "$cfg" "$fragment" || echo "$cfg" >> "$fragment"
              done
            done

            # Remove abi_gki_protected_exports to prevent module build breaks
            rm -f common/android/abi_gki_protected_exports_* 2>/dev/null || true

            # Build static ksu_susfs tool for x86_64 if gcc is present
            if [ -d "susfs4ksu/ksu_susfs" ]; then
              echo "=== Building ksu_susfs userspace tool ==="
              mkdir -p out/dist
              gcc -static -O2 -I"susfs4ksu/ksu_susfs/jni/includes" -I"susfs4ksu/ksu_susfs/jni/features" \
                susfs4ksu/ksu_susfs/jni/main.c susfs4ksu/ksu_susfs/jni/susfs_utils.c susfs4ksu/ksu_susfs/jni/features/*.c \
                -o "out/dist/ksu_susfs" 2>/dev/null || echo "Host gcc failed to build ksu_susfs, skipping standalone binary"
            fi

            rm -rf susfs4ksu
            echo "SuSFS integration finished."
          fi
          # Disable check_defconfig in Kleaf to prevent build errors due to defconfig drift
          echo "=== Patching check_defconfig in Kleaf ==="
          if [ -f "build/kernel/kleaf/common_kernels.bzl" ]; then
            sed -i 's/"match"/"disabled"/g' build/kernel/kleaf/common_kernels.bzl
            sed -i 's/"minimized"/"disabled"/g' build/kernel/kleaf/common_kernels.bzl
            echo "Disabled check_defconfig in build/kernel/kleaf/common_kernels.bzl"
          fi

          find . -maxdepth 3 -type f -name "build.config*" -exec sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"/POST_DEFCONFIG_CMDS=""/g' {} + 2>/dev/null || true

      - name: Build Kernel with Kleaf
        working-directory: android-kernel
        run: |
          set -eo pipefail
          BAZEL_FLAGS=""
          if [ "${{ env.USE_FAST_CONFIG }}" = "true" ]; then
            BAZEL_FLAGS="--config=fast"
          fi

          if [ "${{ env.LTO_MODE }}" != "default" ]; then
            BAZEL_FLAGS="${BAZEL_FLAGS} --lto=${{ env.LTO_MODE }}"
          fi

          BAZEL_FLAGS="${BAZEL_FLAGS} --config=stamp --curses=no --show_progress_rate_limit=5 ${{ env.EXTRA_BAZEL_ARGS }}"

          DIST_DIR="$PWD/out/dist"
          BUILD_LOG="$PWD/out/bazel-build.log"
          mkdir -p "$DIST_DIR" "$PWD/out"
          echo "=========================================="
          echo "Running Bazel Build:"
          echo "tools/bazel run ${BAZEL_FLAGS} ${{ env.BUILD_TARGET }} -- --destdir $DIST_DIR"
          echo "=========================================="

          tools/bazel run ${BAZEL_FLAGS} "${{ env.BUILD_TARGET }}" -- --destdir "$DIST_DIR" 2>&1 | tee "$BUILD_LOG"

          # Report the KernelSU driver version and the manager APK signature the kernel
          # expects, so the matching manager APK can be selected and verified.
          KSU_DRIVER_VER=$(grep -m1 -oE '(KernelSU(-Next)?|SukiSU(-Ultra)?|ReSukiSU) version( code)?: [0-9]+' "$BUILD_LOG" | awk '{print $NF}' || true)
          [ -n "$KSU_DRIVER_VER" ] || KSU_DRIVER_VER=$(grep -m1 -oE 'version( code)?: [0-9]+' "$BUILD_LOG" | awk '{print $NF}' || true)
          KSU_MGR_SIG=$(grep -m1 -oE '(Manager signature hash|signature hash): [0-9a-f]{64}' "$BUILD_LOG" | awk '{print $NF}' || true)
          echo "KernelSU driver version : ${KSU_DRIVER_VER:-unknown}"
          echo "Manager signature hash  : ${KSU_MGR_SIG:-unknown}"
          echo "KSU_DRIVER_VER=${KSU_DRIVER_VER}" >> $GITHUB_ENV
          echo "KSU_MGR_SIG=${KSU_MGR_SIG}" >> $GITHUB_ENV


      - name: Download Matching Manager APK
        run: |
          set -e
          mkdir -p output/dist
          echo "=== Fetching Matching Manager APK for flavor: ${{ env.KSU_FLAVOR }} ==="

          FLAVOR_LOWER="$(echo "${{ env.KSU_FLAVOR }}" | tr '[:upper:]' '[:lower:]')"
          case "$FLAVOR_LOWER" in
            "kernelsu-next")
              KSU_COMMIT_SHA=""
              for d in android-kernel/common/KernelSU-Next android-kernel/common/drivers/kernelsu android-kernel/KernelSU-Next; do
                if [ -d "$d/.git" ] || [ -f "$d/.git" ]; then
                  KSU_COMMIT_SHA=$(git -C "$d" rev-parse HEAD 2>/dev/null || true)
                  [ -n "$KSU_COMMIT_SHA" ] && break
                fi
              done
              RUN_ID=""
              if [ -n "$KSU_COMMIT_SHA" ]; then
                echo "Looking for CI run matching commit: $KSU_COMMIT_SHA"
                RUN_ID=$(gh run list --repo KernelSU-Next/KernelSU-Next --commit "$KSU_COMMIT_SHA" --workflow "Build Manager CI" --json databaseId,conclusion --jq '.[] | select(.conclusion=="success") | .databaseId' 2>/dev/null | head -n 1 || true)
              fi
              if [ -z "$RUN_ID" ]; then
                echo "Falling back to latest successful Build Manager CI run on dev..."
                RUN_ID=$(gh run list --repo KernelSU-Next/KernelSU-Next --branch dev --workflow "Build Manager CI" --status success --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
              fi
              if [ -n "$RUN_ID" ]; then
                echo "Downloading manager artifact from run $RUN_ID..."
                gh run download "$RUN_ID" --repo KernelSU-Next/KernelSU-Next --name manager --dir output/dist/ 2>/dev/null || true
              fi
              ;;

            "kernelsu")
              echo "Downloading latest official KernelSU Manager release APK..."
              gh release download --repo tiann/KernelSU --pattern "*.apk" --dir output/dist/ 2>/dev/null || true
              ;;

            "sukisu"|"sukisu-ultra")
              echo "Downloading latest official SukiSU-Ultra Manager release APK..."
              gh release download --repo SukiSU-Ultra/SukiSU-Ultra --pattern "*.apk" --dir output/dist/ 2>/dev/null || true
              ;;

            "resukisu")
              echo "Finding latest successful Manager build for ReSukiSU..."
              RUN_ID=$(gh run list --repo ReSukiSU/ReSukiSU --workflow "Build Manager" --status success --json databaseId --jq '.[0].databaseId' 2>/dev/null | head -n 1 || true)
              if [ -n "$RUN_ID" ]; then
                echo "Downloading Manager-release from ReSukiSU run $RUN_ID..."
                gh run download "$RUN_ID" --repo ReSukiSU/ReSukiSU --name Manager-release --dir output/dist/ 2>/dev/null || true
              fi
              ;;
          esac

          # Move any nested APKs to output/dist/
          find output/dist -name "*.apk" -exec mv {} output/dist/ \; 2>/dev/null || true
          find output/dist -type d -empty -delete 2>/dev/null || true

          MANAGER_APK=$(ls output/dist/*.apk 2>/dev/null | head -n 1 || true)
          if [ -n "$MANAGER_APK" ]; then
            echo "Successfully retrieved manager APK: $(basename "$MANAGER_APK")"
            echo "MANAGER_APK_NAME=$(basename "$MANAGER_APK")" >> $GITHUB_ENV
          else
            echo "Notice: No manager APK could be retrieved automatically"
            echo "MANAGER_APK_NAME=none" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Artifacts
        run: |
          set -e
          mkdir -p output/dist

          # Locate bzImage
          BZIMAGE_FOUND=""
          if [ -f "android-kernel/out/dist/bzImage" ]; then
            BZIMAGE_FOUND="android-kernel/out/dist/bzImage"
          else
            BZIMAGE_FOUND=$(find android-kernel -name "bzImage" 2>/dev/null | head -n 1)
          fi

          if [ -z "$BZIMAGE_FOUND" ] || [ ! -f "$BZIMAGE_FOUND" ]; then
            echo "::error::bzImage was not found in output directory!"
            exit 1
          fi

          echo "Found bzImage at: $BZIMAGE_FOUND"
          cp "$BZIMAGE_FOUND" output/dist/bzImage

          # Copy vmlinux and System.map if available for debugging/tracing
          find android-kernel -name "vmlinux" 2>/dev/null | head -n 1 | xargs -I {} cp {} output/dist/ 2>/dev/null || true
          find android-kernel -name "System.map" 2>/dev/null | head -n 1 | xargs -I {} cp {} output/dist/ 2>/dev/null || true

          # Collect .ko kernel modules if present
          mkdir -p output/modules
          find android-kernel/out/dist -name "*.ko" -exec cp {} output/modules/ \; 2>/dev/null || true
          find android-kernel/bazel-bin -name "*.ko" -exec cp {} output/modules/ \; 2>/dev/null || true
          if [ "$(ls -A output/modules 2>/dev/null)" ]; then
            tar -czvf output/dist/virtual_device_modules.tar.gz -C output/modules .
            rm -rf output/modules
          else
            rm -rf output/modules
          fi
          # Keep the build log: it records the KernelSU driver version and the manager
          # signature hash the kernel expects.
          cp android-kernel/out/bazel-build.log output/dist/bazel-build.log 2>/dev/null || true
          # Copy ksu_susfs if built
          if [ -f "android-kernel/out/dist/ksu_susfs" ]; then
            cp "android-kernel/out/dist/ksu_susfs" output/dist/ksu_susfs
          fi

          # Compute SHA-256
          cd output/dist
          sha256sum bzImage > bzImage.sha256sum
          BZ_SHA256=$(awk '{print $1}' bzImage.sha256sum)
          BZ_SIZE=$(du -h bzImage | awk '{print $1}')
          echo "BZ_SHA256=$BZ_SHA256" >> $GITHUB_ENV
          echo "BZ_SIZE=$BZ_SIZE" >> $GITHUB_ENV
          echo "=== Artifacts Summary ==="
          ls -lh
          echo "SHA256 of bzImage: $BZ_SHA256"

      - name: Generate Build Summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## AVD KernelSU Build Succeeded

          | Item | Value |
          | :--- | :--- |
          | **Manifest Branch** | \`${{ env.KERNEL_MANIFEST_BRANCH }}\` |
          | **KernelSU Flavor** | \`${{ env.KSU_FLAVOR }}\` (\`${{ env.KSU_VERSION }}\`) |
          | **KernelSU driver version** | \`${{ env.KSU_DRIVER_VER }}\` |
          | **Manager signature hash** | \`${{ env.KSU_MGR_SIG }}\` |
          | **SuSFS Integrated** | \`${{ env.ENABLE_SUSFS }}\` |
          | **Target** | \`${{ env.BUILD_TARGET }}\` |
          | **LTO Mode** | \`${{ env.LTO_MODE }}\` |
          | **bzImage Size** | \`${{ env.BZ_SIZE }}\` |
          | **bzImage SHA256** | \`${{ env.BZ_SHA256 }}\` |
          | **Bundled Manager APK** | \`${{ env.MANAGER_APK_NAME }}\` |

          > 安装管理器 APK 时请选择 versionCode 与上方 **KernelSU driver version** 一致、且签名证书 SHA-256 等于 **Manager signature hash** 的版本，详见 README 第 7 节。

          ### How to Launch AVD with this Kernel

          **Option 1: Command Line Launch**
          ```powershell
          emulator @Pixel_10 -kernel path\to\bzImage -show-kernel
          ```

          **Option 2: Android Studio Persistence**
          Replace `<sysdir>\kernel-ranchu` in your SDK system-images folder with `bzImage` and remove/rename `snapshots\default_boot`.
          Editing `kernel.path` in `config.ini` is overridden by the emulator and does not take effect.
          EOF

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: avd-kernelsu-${{ env.KSU_FLAVOR }}-${{ github.run_id }}
          path: |
            output/dist/bzImage
            output/dist/bzImage.sha256sum
            output/dist/virtual_device_modules.tar.gz
            output/dist/vmlinux
            output/dist/System.map
            output/dist/bazel-build.log
            output/dist/ksu_susfs
            output/dist/*.apk
          retention-days: 90

      - name: Create Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v6.12-ksu-{0}', github.run_number) }}
          name: AVD KernelSU ${{ env.KSU_FLAVOR }} (${{ env.KERNEL_MANIFEST_BRANCH }})
          body: |
            ## AVD KernelSU Custom Kernel Release
            - **AOSP Kernel Branch**: `${{ env.KERNEL_MANIFEST_BRANCH }}`
            - **KernelSU Flavor**: `${{ env.KSU_FLAVOR }}` (`${{ env.KSU_VERSION }}`)
            - **KernelSU driver version**: `${{ env.KSU_DRIVER_VER }}`
            - **Manager signature hash**: `${{ env.KSU_MGR_SIG }}`
            - **Build Target**: `${{ env.BUILD_TARGET }}`
            - **LTO**: `${{ env.LTO_MODE }}`
            - **bzImage Size**: `${{ env.BZ_SIZE }}`
            - **bzImage SHA256**: `${{ env.BZ_SHA256 }}`
            - **SuSFS Integrated**: `${{ env.ENABLE_SUSFS }}`
            > Use a manager APK whose versionCode equals the KernelSU driver version above and
            > whose signing certificate SHA-256 equals the manager signature hash above.

            ```powershell
            emulator @<AVD_NAME> -kernel path\to\bzImage -show-kernel
            ```
          files: |
            output/dist/bzImage
            output/dist/bzImage.sha256sum
            output/dist/*.tar.gz
            output/dist/ksu_susfs
            output/dist/*.apk
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
